<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title><link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Iniciar sesión</h1>
  <form data-endpoint="/api/login" data-redirect="panel.html">
    <label>Correo <input name="correo" type="text" autocomplete="email"></label>
    <label>Contraseña <input name="password" type="password" autocomplete="current-password"></label>
    <button>Entrar</button>
  </form>
  <p id="mensaje"></p>
  <p><a href="registro.html">Crear cuenta</a> · <a href="recuperar.html">Olvidé mi contraseña</a></p>
  <script src="app.js"></script>
</body>
</html>
